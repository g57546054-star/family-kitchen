name: Native MiniProgram checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            miniprogram/package-lock.json
      - name: Install web dependencies for parity checks
        run: npm ci --no-audit --no-fund
      - name: Install MiniProgram dependencies
        run: npm ci --prefix miniprogram --no-audit --no-fund
      - name: Validate native resources and event bindings
        run: npm run check --prefix miniprogram
      - name: Test native logic, migration, storage and page controllers
        run: npm test --prefix miniprogram
      - name: Install Chromium for statistics layout regressions
        run: npx playwright install --with-deps chromium
      - name: Check small-screen statistics in the Chromium CSS model
        run: npm run test:layout --prefix miniprogram
      - name: Verify existing web build
        run: npm run build
      - name: Test existing web app
        run: npm test
